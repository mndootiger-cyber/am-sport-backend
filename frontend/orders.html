<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات — AM SPORT</title>
<style>
  :root{
    --bg:#0c0c0d;
    --card:#151516;
    --border:#2a2a2c;
    --border-h:#3a3a3d;
    --gold:#c9a25c;
    --gold-soft:#e8cd94;
    --white:#f5f5f4;
    --muted:#9a9a9c;
    --danger:#e0524a;
    --success:#4caf6e;
    --pending:#c9a25c;
    --shipped:#4a90c9;
    --delivered:#4caf6e;
    --r:10px;
    --r-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.2rem 2rem;
    border-bottom:1px solid var(--border);
    background:var(--card);
  }
  .brand{
    font-size:1.4rem;font-weight:800;letter-spacing:2px;color:var(--gold);
    text-transform:uppercase;
  }
  nav{display:flex;gap:0.75rem;align-items:center;}
  nav a{
    color:var(--muted);text-decoration:none;font-size:0.9rem;
    padding:0.5rem 0.9rem;border-radius:var(--r-sm);transition:0.2s;
  }
  nav a:hover, nav a.active{color:var(--white);background:rgba(255,255,255,0.06);}
  #logoutBtn{
    background:transparent;border:1px solid var(--border-h);color:var(--muted);
    padding:0.5rem 1rem;border-radius:var(--r-sm);cursor:pointer;font-size:0.85rem;
  }
  #logoutBtn:hover{color:var(--danger);border-color:var(--danger);}

  main{padding:2rem;max-width:1400px;margin:0 auto;}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;}
  .stat-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--r);
    padding:1.2rem;text-align:center;
  }
  .stat-card .num{font-size:1.8rem;font-weight:800;color:var(--gold);}
  .stat-card .label{font-size:0.8rem;color:var(--muted);margin-top:0.3rem;}

  .filter-row{display:flex;gap:0.6rem;margin-bottom:1.2rem;flex-wrap:wrap;}
  .filter-btn{
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    padding:0.5rem 1rem;border-radius:999px;cursor:pointer;font-size:0.85rem;transition:0.2s;
  }
  .filter-btn.active{background:var(--gold);color:#151516;border-color:var(--gold);font-weight:700;}

  .orders-wrap{
    background:var(--card);border:1px solid var(--border);border-radius:var(--r);
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:right;padding:0.9rem 1rem;font-size:0.78rem;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);
  }
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody td{padding:0.9rem 1rem;font-size:0.88rem;vertical-align:top;}
  .order-num{color:var(--gold);font-weight:700;}
  .order-date{color:var(--muted);font-size:0.75rem;margin-top:0.2rem;}
  .customer-name{font-weight:600;}
  .customer-phone{color:var(--muted);font-size:0.8rem;direction:ltr;text-align:right;display:inline-block;}
  .items-list{font-size:0.8rem;color:var(--muted);max-width:220px;}
  .items-list div{margin-bottom:0.2rem;}
  .total{font-weight:700;color:var(--white);}

  .status-badge{
    display:inline-block;padding:0.3rem 0.7rem;border-radius:999px;font-size:0.75rem;font-weight:700;
  }
  .status-pending{background:rgba(201,162,92,0.15);color:var(--pending);}
  .status-shipped{background:rgba(74,144,201,0.15);color:var(--shipped);}
  .status-delivered{background:rgba(76,175,110,0.15);color:var(--delivered);}
  .status-cancelled{background:rgba(224,82,74,0.15);color:var(--danger);}

  select.status-select{
    background:var(--bg);color:var(--white);border:1px solid var(--border-h);
    border-radius:var(--r-sm);padding:0.35rem 0.5rem;font-size:0.8rem;margin-top:0.4rem;cursor:pointer;
  }

  .empty-state{
    text-align:center;padding:4rem 2rem;color:var(--muted);
  }
  .empty-state svg{opacity:0.3;margin-bottom:1rem;}

  .whatsapp-link{
    display:inline-flex;align-items:center;gap:0.3rem;margin-top:0.4rem;
    color:var(--success);text-decoration:none;font-size:0.78rem;
  }

  #toast-container{position:fixed;top:1rem;left:1rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;}
  .toast{
    background:var(--card);border:1px solid var(--border-h);border-radius:var(--r-sm);
    padding:0.7rem 1rem;font-size:0.85rem;display:flex;align-items:center;gap:0.5rem;
    animation:slideIn 0.25s ease;
  }
  .toast.success{border-color:var(--success);color:var(--success);}
  .toast.error{border-color:var(--danger);color:var(--danger);}
  @keyframes slideIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}

  @media (max-width:800px){
    thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{padding:1rem;border-bottom:6px solid var(--bg);}
    tbody td{padding:0.4rem 0;border:none;}
    tbody td::before{content:attr(data-label);display:block;color:var(--muted);font-size:0.72rem;margin-bottom:0.15rem;}
  }
</style>
</head>
<body>

<div id="toast-container"></div>

<header>
  <div class="brand">AM SPORT</div>
  <nav>
    <a href="admin.html">المنتجات</a>
    <a href="orders.html" class="active">الطلبات</a>
    <button id="logoutBtn">تسجيل الخروج</button>
  </nav>
</header>

<main>
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="totalOrders">0</div><div class="label">إجمالي الطلبات</div></div>
    <div class="stat-card"><div class="num" id="pendingOrders">0</div><div class="label">قيد التجهيز</div></div>
    <div class="stat-card"><div class="num" id="shippedOrders">0</div><div class="label">تم الشحن</div></div>
    <div class="stat-card"><div class="num" id="deliveredOrders">0</div><div class="label">تم التسليم</div></div>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" data-filter="all">الكل</button>
    <button class="filter-btn" data-filter="pending">قيد التجهيز</button>
    <button class="filter-btn" data-filter="shipped">تم الشحن</button>
    <button class="filter-btn" data-filter="delivered">تم التسليم</button>
    <button class="filter-btn" data-filter="cancelled">ملغي</button>
  </div>

  <div class="orders-wrap">
    <table>
      <thead>
        <tr>
          <th>رقم الطلب</th>
          <th>العميل</th>
          <th>العنوان</th>
          <th>المنتجات</th>
          <th>الإجمالي</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody">
        <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--muted)">جارٍ تحميل الطلبات...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
